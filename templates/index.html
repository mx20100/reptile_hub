<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reptile Hub</title>
    <style>
        :root { 
            --bg: #f4f4f4; 
            --text: #333; 
            --btn: #fff; 
            --btn-border: #ccc; 
        }

        body.dark-theme { 
            --bg: #1a1a1a; 
            --text: #f4f4f4; 
            --btn: #333; 
            --btn-border: #555; 
        }
        
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: sans-serif; 
            margin: 0; 
            padding: 10px; 
            height: 100vh; 
            width: 100vw; 
            overflow: hidden; 
            box-sizing: border-box;
            user-select: none; /* Prevents text highlighting while dragging */
        }

        h1 { margin: 5px 0; font-size: 24px; text-align: center; }
        
        /* Grid for main buttons - RESTORED TO 2 COLUMNS */
        #main-view { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 15px; 
            margin-top: 15px;
        }

        /* Restored to look like big clickable square cards */
        .animal-card {
            background: var(--btn);
            color: var(--text);
            border: 2px solid var(--btn-border);
            border-radius: 12px;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: transform 0.1s;
            min-height: 110px;
        }
        .animal-card:active { transform: scale(0.98); }
        
        /* Modal / Screens - RESTORED SCROLLING */
        .screen { 
            display: none; 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: var(--bg); 
            padding: 20px; 
            box-sizing: border-box; 
            z-index: 10; 
            overflow-y: auto; /* This brings scrolling back! */
            padding-bottom: 80px; 
        }
        .active { display: block; }
        
        .action-btns { display: grid; grid-template-columns: 1fr; gap: 15px; margin-top: 20px; }
        button { 
            padding: 15px; font-size: 22px; border-radius: 8px; cursor: pointer; 
            background: var(--btn); color: var(--text); border: 1px solid var(--btn-border);
        }
        
        /* Status Animations */
        @keyframes pulse-red { 0% { border-color: var(--btn-border); } 100% { border-color: #ff4c4c; box-shadow: 0 0 10px #ff4c4c; } }
        .needs-feeding { animation: pulse-red 0.8s ease-in-out infinite alternate; }

        .status-critical { border: 2px solid #ff4c4c; }
        .status-warning { border: 2px solid #ffa500; }
        .status-good { border: 2px solid #4CAF50; }

        #settings-btn { position: absolute; bottom: 10px; right: 10px; font-size: 16px; padding: 10px; z-index: 20; }
        .close-btn { background: #ff4c4c; color: white; border: none; }
        
        input, select { padding: 10px; font-size: 18px; margin: 5px 0; width: 100%; box-sizing: border-box; background: var(--btn); color: var(--text); border: 1px solid var(--btn-border); user-select: auto; }

        /* Toast */
        .toast { position: fixed; top: 20px; right: -400px; background: #4CAF50; color: white; padding: 15px 20px; border-radius: 8px; transition: right 0.4s; z-index: 10000; display: flex; align-items: center; gap: 12px; }
        .toast.show { right: 20px; }
        .toast.error { background: #f44336; }
    </style>
</head>
<body>
    <div id="toast" class="toast"><span id="toast-icon">✅</span><span id="toast-msg">Action successful!</span></div>

    <div id="home" class="screen active">
        <h1>Reptile Hub</h1>
        <div id="main-view"></div>
        <button id="settings-btn" onclick="showScreen('settings')">⚙️ Settings</button>
    </div>

    <div id="animal-actions" class="screen">
        <h1 id="action-title">Animal Name</h1>
        <div class="action-btns">
            <button onclick="logAction('fed')">Animal Fed</button>
            <button onclick="weighAnimal()">Animal Weighed</button>
            <button onclick="showInfo()">Information</button>
            <button class="close-btn" onclick="showScreen('home')">Back</button>
        </div>
    </div>

    <div id="animal-info" class="screen">
        <h1 id="info-title">Information</h1>
        <div style="font-size: 22px; line-height: 1.6; margin-top: 20px;" id="info-content"></div>
        <button class="close-btn" style="position: absolute; bottom: 80px; width: calc(100% - 40px); background: #8b0000;" onclick="deleteAnimal()">Delete Animal</button>
        <button class="close-btn" style="position: absolute; bottom: 20px; width: calc(100% - 40px);" onclick="showScreen('animal-actions')">Back</button>
    </div>

    <div id="settings" class="screen">
        <button onclick="window.location.href='/wifi_setup'" style="position: absolute; top: 10px; right: 10px; font-size: 14px; padding: 5px 10px; width: auto;">
            📶 <span id="current-ssid">...</span>
        </button>
        <h1>Settings</h1>
        <div style="background: var(--btn); border: 1px solid var(--btn-border); padding: 10px; border-radius: 8px; margin-bottom: 20px; text-align: center;">
            <p style="margin:0;">Hub IP Address:</p>
            <p style="margin:5px 0 0 0; font-size: 20px; font-weight: bold; color: #4CAF50;" id="pi-ip-address">Loading...</p>
        </div>
        <button onclick="toggleTheme()" style="width: 100%; margin-bottom: 20px;">Toggle Theme</button>
        <h3>Add New Animal</h3>
        <input type="text" id="new-name" placeholder="Name">
        <select id="new-category" onchange="updateSpecies()"></select>
        <select id="new-species"></select>
        <input type="number" id="new-freq" placeholder="Feed Freq (Days)">
        <button style="width: 100%; background: #4CAF50; color: white;" onclick="addAnimal()">Add Animal</button>
        <button class="close-btn" style="width: 100%; margin-top: 20px;" onclick="showScreen('home')">Back</button>
    </div>

    <script>
        let currentAnimal = null;
        let speciesCatalog = {};

        async function loadCatalog() {
            try {
                const response = await fetch('/api/catalog');
                speciesCatalog = await response.json();
                const catSelect = document.getElementById('new-category');
                catSelect.innerHTML = '';
                for (const cat in speciesCatalog) {
                    catSelect.innerHTML += `<option value="${cat}">${cat}</option>`;
                }
                updateSpecies();
            } catch (e) { console.error(e); }
        }

        function updateSpecies() {
            const cat = document.getElementById('new-category').value;
            const specSelect = document.getElementById('new-species');
            specSelect.innerHTML = '';
            if (speciesCatalog[cat]) {
                speciesCatalog[cat].forEach(s => specSelect.innerHTML += `<option value="${s}">${s}</option>`);
            }
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = message;
            document.getElementById('toast-icon').innerText = isError ? '⚠️' : '✅';
            isError ? toast.classList.add('error') : toast.classList.remove('error');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        async function loadData() {
            try {
                const response = await fetch('/api/data');
                const animals = await response.json();
                const container = document.getElementById('main-view');
                container.innerHTML = '';

                animals.forEach(animal => {
                    const status = animal.status || 'good';
                    const card = document.createElement('div');
                    card.className = `animal-card status-${status} ${status === 'critical' ? 'needs-feeding' : ''}`;
                    card.onclick = () => {
                        currentAnimal = animal;
                        document.getElementById('action-title').innerText = animal.name;
                        showScreen('animal-actions');
                    };
                    card.innerHTML = `
                        <div style="font-size: 24px; font-weight: bold;">${animal.name}</div>
                        <div style="font-size: 14px; margin-bottom: 8px;">${animal.species}</div>
                        <div style="font-size: 14px; opacity: 0.9;">Next: ${animal.next_fed || 'ASAP'}</div>
                        <div style="font-size: 12px; opacity: 0.7; margin-top: 4px;">W: ${animal.last_weight || 'No data'}</div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) { console.error("UI Crash:", e); }
        }

        async function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'home') loadData();
            if(id === 'settings') {
                const wifi = await (await fetch('/api/wifi/current')).json();
                document.getElementById('current-ssid').innerText = wifi.ssid;
                const ip = await (await fetch('/api/ip')).json();
                document.getElementById('pi-ip-address').innerText = ip.ip;
            }
        }

        async function logAction(action, value=0) {
            await fetch('/api/action', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({animal_id: currentAnimal.id, action: action, value: value})
            });
            showToast('Logged!');
            showScreen('home');
        }

        function weighAnimal() {
            const weight = prompt("Grams:");
            if (weight && !isNaN(weight)) logAction('weighed', parseFloat(weight));
        }

        function showInfo() {
            document.getElementById('info-title').innerText = currentAnimal.name + " Info";
            let html = `
                <strong>Last Fed:</strong> ${currentAnimal.last_fed}<br>
                <strong>Next Feed:</strong> ${currentAnimal.next_fed}<br>
                <strong>Freq:</strong> Every ${currentAnimal.feed_days} days<br>
                <strong>Weight:</strong> ${currentAnimal.last_weight}<br>
                <small>(Weighed: ${currentAnimal.last_weighed_date})</small>
                <hr style="border:0; border-top:1px solid var(--btn-border); margin:15px 0;">
                <div style="background:var(--btn); border:2px solid #4CAF50; padding:10px; border-radius:10px;">
                    <strong style="color:#4CAF50;">🍽️ Feeder Recommendation:</strong><br>
                    <div style="margin-top:5px;">${currentAnimal.feeder_rec}</div>
                </div>
            `;
            document.getElementById('info-content').innerHTML = html;
            showScreen('animal-info');
        }

        async function addAnimal() {
            const data = {
                name: document.getElementById('new-name').value,
                category: document.getElementById('new-category').value,
                species: document.getElementById('new-species').value,
                feed_days: parseInt(document.getElementById('new-freq').value),
            };
            if(!data.name || isNaN(data.feed_days)) return showToast("Check inputs", true);
            const res = await fetch('/api/add', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)});
            if(res.ok) { showToast('Added!'); loadData(); showScreen('home'); }
        }

        async function deleteAnimal() {
            if(confirm(`Delete ${currentAnimal.name}?`)) {
                await fetch(`/api/delete/${currentAnimal.id}`, { method: 'DELETE' });
                showToast('Deleted');
                showScreen('home');
            }
        }

        async function toggleTheme() {
            const newTheme = document.body.classList.contains('dark-theme') ? 'light' : 'dark';
            document.body.className = newTheme === 'dark' ? 'dark-theme' : '';
            await fetch('/api/theme', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({theme: newTheme})});
        }

        window.onload = () => { loadData(); loadCatalog(); }
        setInterval(() => { if(document.getElementById('home').classList.contains('active')) loadData(); }, 300000);
    </script>

    <script>
        document.querySelectorAll('input, select').forEach(input => {
            input.addEventListener('focus', () => {
                const activeContainer = document.querySelector('.screen.active') || document.body;
                activeContainer.style.paddingBottom = '260px'; 
                setTimeout(() => { input.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 300);
            });
            input.addEventListener('blur', () => {
                const activeContainer = document.querySelector('.screen.active') || document.body;
                activeContainer.style.paddingBottom = '80px';
            });
        });

        let isDown = false;
        let startY;
        let scrollTop;
        let scrollContainer;

        function startDrag(e) {
            scrollContainer = e.target.closest('.screen.active') || document.body;
            isDown = true;
            const pageY = e.pageY || e.touches[0].pageY;
            startY = pageY - scrollContainer.offsetTop;
            scrollTop = scrollContainer.scrollTop;
        }

        function stopDrag() { isDown = false; }

        function drag(e) {
            if (!isDown || !scrollContainer) return;
            const pageY = e.pageY || e.touches[0].pageY;
            const y = pageY - scrollContainer.offsetTop;
            const walk = (y - startY) * 1.5; 
            scrollContainer.scrollTop = scrollTop - walk;
        }

        document.addEventListener('mousedown', startDrag);
        document.addEventListener('mouseleave', stopDrag);
        document.addEventListener('mouseup', stopDrag);
        document.addEventListener('mousemove', drag);
        document.addEventListener('touchstart', startDrag, {passive: true});
        document.addEventListener('touchend', stopDrag);
        document.addEventListener('touchmove', drag, {passive: true});
    </script>
</body>
</html>
