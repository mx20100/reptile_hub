<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reptile Hub — Wi-Fi Setup</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        :root {
            --bg: #f0f2f5;
            --card: #ffffff;
            --text: #1a1a2e;
            --border: #dde1e7;
            --accent: #3aaa5c;
            --radius: 14px;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
            user-select: none;
        }

        .card {
            background: var(--card);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 4px 20px rgba(0,0,0,0.10);
            padding: 32px 28px 28px 28px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .logo { font-size: 42px; margin-bottom: 8px; }
        h1 { margin: 0 0 6px 0; font-size: 24px; font-weight: 700; }
        .subtitle { font-size: 15px; opacity: 0.6; margin: 0 0 24px 0; }

        select, input {
            display: block;
            width: 100%;
            padding: 14px 16px;
            font-size: 18px;
            font-family: inherit;
            margin: 0 0 14px 0;
            background: var(--bg);
            color: var(--text);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            outline: none;
            user-select: auto;
            transition: border-color 0.2s;
        }
        input:focus, select:focus { border-color: var(--accent); }

        button {
            display: block;
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-family: inherit;
            font-weight: 600;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            margin-bottom: 10px;
            transition: opacity 0.15s;
        }
        button:active { opacity: 0.75; }

        .btn-connect { background: var(--accent); color: white; }
        .btn-skip    { background: transparent; color: var(--text); border: 1.5px solid var(--border); font-weight: 500; }

        #loading {
            display: none;
            margin-top: 18px;
            font-size: 16px;
            opacity: 0.6;
            text-align: center;
        }

        .spinner {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* OSK */
        #osk {
            display: none; position: fixed; bottom: 0; left: 0; width: 100%;
            background: #fff; border-top: 2px solid #dde1e7;
            padding: 4px 2px 6px; box-sizing: border-box; z-index: 9000;
            user-select: none; touch-action: none;
        }
        #osk.osk-visible { display: block; }
        .osk-row { display: flex; justify-content: center; gap: clamp(2px,.8vw,6px); margin-bottom: clamp(2px,.6vh,5px); }
        .osk-key {
            background: #f0f2f5; color: #1a1a2e; border: 1.5px solid #dde1e7; border-radius: 6px;
            min-width: clamp(28px,8.5vw,68px); height: clamp(34px,7.5vh,52px);
            font-size: clamp(13px,3.2vw,20px); display: flex; align-items: center;
            justify-content: center; cursor: pointer; flex-shrink: 0;
        }
        .osk-key:active, .osk-key.osk-pressed { background: #dde1e7; }
        .osk-key[data-action="backspace"] { min-width: clamp(44px,13vw,100px); }
        .osk-key[data-action="shift"]     { min-width: clamp(44px,13vw,100px); }
        .osk-key[data-action="space"]     { min-width: clamp(120px,38vw,280px); }
        .osk-key[data-action="done"]      { min-width: clamp(56px,14vw,110px); background: #2196F3; color: white; border-color: #1565C0; }
        .osk-key[data-action="shift"].osk-shift-on { background: #3aaa5c; color: white; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🦎</div>
        <h1>Reptile Hub</h1>
        <p class="subtitle">Select your Wi-Fi network to get started.</p>

        <select id="network-list">
            <option>Scanning for networks...</option>
        </select>

        <input type="password" id="password" placeholder="Wi-Fi Password (if required)">

        <button class="btn-connect" onclick="connectWifi()">📶 Connect</button>
        <button class="btn-skip"    onclick="skipWifi()">Skip for Now</button>

        <div id="loading"><span class="spinner"></span>Connecting, please wait...</div>
    </div>

    <!-- On-screen keyboard for password field -->
    <div id="osk">
        <div class="osk-row">
            <div class="osk-key" data-char="q">q</div><div class="osk-key" data-char="w">w</div><div class="osk-key" data-char="e">e</div><div class="osk-key" data-char="r">r</div><div class="osk-key" data-char="t">t</div><div class="osk-key" data-char="y">y</div><div class="osk-key" data-char="u">u</div><div class="osk-key" data-char="i">i</div><div class="osk-key" data-char="o">o</div><div class="osk-key" data-char="p">p</div>
        </div>
        <div class="osk-row">
            <div class="osk-key" data-char="a">a</div><div class="osk-key" data-char="s">s</div><div class="osk-key" data-char="d">d</div><div class="osk-key" data-char="f">f</div><div class="osk-key" data-char="g">g</div><div class="osk-key" data-char="h">h</div><div class="osk-key" data-char="j">j</div><div class="osk-key" data-char="k">k</div><div class="osk-key" data-char="l">l</div>
        </div>
        <div class="osk-row">
            <div class="osk-key" data-action="shift">⇧</div><div class="osk-key" data-char="z">z</div><div class="osk-key" data-char="x">x</div><div class="osk-key" data-char="c">c</div><div class="osk-key" data-char="v">v</div><div class="osk-key" data-char="b">b</div><div class="osk-key" data-char="n">n</div><div class="osk-key" data-char="m">m</div><div class="osk-key" data-action="backspace">⌫</div>
        </div>
        <div class="osk-row">
            <div class="osk-key" data-char="1">1</div><div class="osk-key" data-char="2">2</div><div class="osk-key" data-char="3">3</div><div class="osk-key" data-char="4">4</div><div class="osk-key" data-char="5">5</div><div class="osk-key" data-char="6">6</div><div class="osk-key" data-char="7">7</div><div class="osk-key" data-char="8">8</div><div class="osk-key" data-char="9">9</div><div class="osk-key" data-char="0">0</div>
        </div>
        <div class="osk-row">
            <div class="osk-key" data-char="!">!</div><div class="osk-key" data-char="@">@</div><div class="osk-key" data-char="#">#</div><div class="osk-key" data-char="$">$</div><div class="osk-key" data-char="-">-</div><div class="osk-key" data-action="space">space</div><div class="osk-key" data-char=".">.</div><div class="osk-key" data-action="done">Done</div>
        </div>
    </div>

    <script>
        window.onload = async () => {
            try {
                const res  = await fetch('/api/wifi/scan');
                const data = await res.json();
                const sel  = document.getElementById('network-list');
                sel.innerHTML = '';
                if (data.networks && data.networks.length > 0) {
                    data.networks.forEach(net => {
                        sel.innerHTML += `<option value="${net}">${net}</option>`;
                    });
                } else {
                    sel.innerHTML = `<option>No networks found — try again</option>`;
                }
            } catch (err) {
                document.getElementById('network-list').innerHTML = `<option>Error scanning</option>`;
            }
        };

        async function connectWifi() {
            const ssid     = document.getElementById('network-list').value;
            const password = document.getElementById('password').value;
            document.getElementById('loading').style.display = 'block';
            try {
                const res  = await fetch('/api/wifi/connect', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ssid, password})
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = '/';
                } else {
                    alert('Failed to connect: ' + (data.error || 'Please check the password.'));
                    document.getElementById('loading').style.display = 'none';
                }
            } catch (err) {
                alert('Network error trying to connect.');
                document.getElementById('loading').style.display = 'none';
            }
        }

        async function skipWifi() {
            await fetch('/api/wifi/skip', {method: 'POST'});
            window.location.href = '/';
        }

        // ── On-screen keyboard ──
        const osk = document.getElementById('osk');
        let oskTarget = null;
        let oskShift  = false;

        function showOsk(el) {
            oskTarget = el;
            osk.classList.add('osk-visible');
            document.body.style.paddingBottom = (osk.getBoundingClientRect().height + 20) + 'px';
        }
        function hideOsk() {
            osk.classList.remove('osk-visible');
            document.body.style.paddingBottom = '';
            if (oskTarget) { oskTarget.blur(); oskTarget = null; }
            oskShift = false;
            updateShift();
        }
        function updateShift() {
            document.querySelectorAll('.osk-key[data-action="shift"]').forEach(k => k.classList.toggle('osk-shift-on', oskShift));
            document.querySelectorAll('.osk-key[data-char]').forEach(k => {
                const c = k.dataset.char;
                if (c && c.length === 1 && c >= 'a' && c <= 'z') k.textContent = oskShift ? c.toUpperCase() : c;
            });
        }
        function oskInsert(ch) {
            if (!oskTarget) return;
            const s = oskTarget.selectionStart, e = oskTarget.selectionEnd, v = oskTarget.value;
            oskTarget.value = v.slice(0, s) + ch + v.slice(e);
            oskTarget.setSelectionRange(s + 1, s + 1);
            if (oskShift) { oskShift = false; updateShift(); }
        }
        function oskDelete() {
            if (!oskTarget) return;
            const s = oskTarget.selectionStart, e = oskTarget.selectionEnd, v = oskTarget.value;
            if (s !== e) { oskTarget.value = v.slice(0, s) + v.slice(e); oskTarget.setSelectionRange(s, s); }
            else if (s > 0) { oskTarget.value = v.slice(0, s - 1) + v.slice(s); oskTarget.setSelectionRange(s - 1, s - 1); }
        }

        osk.querySelectorAll('.osk-key').forEach(key => {
            const handle = (e) => {
                e.preventDefault();
                key.classList.add('osk-pressed');
                setTimeout(() => key.classList.remove('osk-pressed'), 120);
                const ch = key.dataset.char, action = key.dataset.action;
                if (ch !== undefined)         oskInsert(oskShift ? ch.toUpperCase() : ch);
                else if (action === 'backspace') oskDelete();
                else if (action === 'shift')     { oskShift = !oskShift; updateShift(); }
                else if (action === 'space')     oskInsert(' ');
                else if (action === 'done')      hideOsk();
            };
            key.addEventListener('touchstart', handle, {passive: false});
            key.addEventListener('mousedown',  handle);
        });
        osk.addEventListener('touchstart', e => e.stopPropagation(), {passive: false});
        osk.addEventListener('touchmove',  e => { e.preventDefault(); e.stopPropagation(); }, {passive: false});
        osk.addEventListener('mousedown',  e => e.stopPropagation());

        document.getElementById('password').addEventListener('focus', function() { showOsk(this); });
        document.addEventListener('touchstart', e => {
            if (!osk.classList.contains('osk-visible')) return;
            if (!osk.contains(e.target) && e.target !== document.getElementById('password')) hideOsk();
        }, {passive: true});
        document.addEventListener('mousedown', e => {
            if (!osk.classList.contains('osk-visible')) return;
            if (!osk.contains(e.target) && e.target !== document.getElementById('password')) hideOsk();
        });
    </script>
</body>
</html>
